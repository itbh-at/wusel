# Antora playbook for the wusel docs.
# Run from the documentation directory:  ./build.sh   (or ./build.sh watch)
#
# The UI bundle under ./ui-bundle is checked in unpacked. It is adapted from
# the Antora Default UI and licensed MPL-2.0 (see ui-bundle/LICENSE and
# ui-bundle/NOTICE).
site:
  title: Wusel
  start_page: wusel::index.adoc

content:
  sources:
    # LOCAL/dev build. `branches: HEAD` uses the current working tree, including
    # unsaved changes of the checked-out branch — this is what `build.sh` /
    # `build.sh watch` preview. The published multi-version site uses
    # antora-playbook-site.yml instead (main → "latest", release tags → their
    # numbers); the version is not in antora.yml, so it is supplied here too.
    - url: ..
      branches: HEAD
      start_path: documentation
      version: latest

antora:
  extensions:
    # Full-text search. The extension indexes the generated pages and writes the
    # index beside the site (search-index.js); the search box in the header, the
    # client-side UI and its stylesheet come from the UI bundle. Everything runs
    # in the reader's browser — no search server, no external service.
    - require: '@antora/lunr-extension'

runtime:
  log:
    format: json

ui:
  bundle:
    url: ui-bundle

asciidoc:
  attributes:
    attribute-missing: warn@
