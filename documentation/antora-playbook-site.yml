# Antora playbook for the PUBLISHED site (GitHub Pages). Unlike
# antora-playbook.yml, which previews the working tree for local editing, this
# one builds every version: the default branch as "latest", plus each release
# tag as its number, so the site carries a version selector.
#
# Run via `documentation/build.sh site` (the Pages workflow does exactly that);
# it needs the repo's full history and tags, which the workflow fetches.
site:
  title: Wusel
  start_page: wusel::index.adoc
  # An absolute URL is what makes Antora emit sitemap.xml at all — without it
  # there is none, and a search engine has to discover every page by following
  # links. It also makes the canonical URL on each page absolute.
  url: https://wusel.itbh.at

content:
  sources:
    - url: ..
      start_path: documentation
      # `main` is "latest"; a release tag vX.Y.Z becomes the version X.Y.Z.
      branches: [main]
      # Release tags join the selector, with one exception. The retagging onto
      # commits whose antora.yml omits the `version` key happened in the
      # internal repository; the tag published as v0.1.0 still points at the
      # original commit and carries `version: ~`. That makes the ref
      # *unversioned*, which collides with any other unversioned ref and takes
      # the site root — visitors would land on one release's documentation
      # instead of the current one. Excluded until it is ever republished.
      tags: ['v*', '!v0.1.0']
      version:
        'v(?<version>+({0..9}).+({0..9}).+({0..9}))': $<version>
        main: latest

antora:
  extensions:
    # Full-text search; see antora-playbook.yml for what the extension adds.
    - require: '@antora/lunr-extension'
      # This site carries every release as its own version. Indexing them all
      # would answer a query with a hit from an old release as readily as from
      # the current one, so only "latest" goes into the index.
      index_latest_only: true

runtime:
  log:
    format: json

urls:
  # The Diátaxis restructure moved every page into its section, which broke
  # every URL a search engine had indexed. `static` makes Antora emit a small
  # redirect page at each old address, driven by the `page-aliases` attribute on
  # the page that replaced it — so the old links keep working and the ranking
  # they earned follows them instead of expiring in a 404.
  redirect_facility: static

ui:
  bundle:
    url: ui-bundle
  # Copied verbatim into the site root: the CNAME GitHub Pages needs for the
  # custom domain (the deploy uploads this directory as the whole site, so a
  # file added by hand in the repository settings would be gone on the next
  # build), and robots.txt pointing at the sitemap.
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    attribute-missing: warn@
