[package]
name = "wusel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published to crates.io: the product ships as an RPM and the crates
# refer to each other by path, which crates.io would reject anyway. Opting
# out here makes an accidental `cargo publish` fail instead of claiming a name.
publish.workspace = true

# wusel is the daemon/CLI binary — the actual product. It ties the engine
# (wusel-core) and the OS frontends together.

[[bin]]
name = "wusel"
path = "src/main.rs"

[features]
# Without this feature wusel builds as pure CLI/core (e.g. on macOS, or for
# quick checks). With `--features fuse` the FUSE frontend (Linux) is added.
# `dep:wusel-fuse` activates the optional dependency.
default = []
fuse = ["dep:wusel-fuse"]

[dependencies]
wusel-core = { path = "../wusel-core" }
wusel-fuse = { path = "../wusel-fuse", optional = true }
wusel-desktop = { path = "../wusel-desktop" }
# The socket frontend (macOS File Provider IPC spike). Not behind `fuse`:
# running the engine without a FUSE mount is the whole point of `serve`.
wusel-ipc = { path = "../wusel-ipc" }
# getppid for the parent-death watchdog in `serve`: it must exit when the
# spawning agent dies, or an abrupt kill (Xcode stop, logout) leaves an orphaned
# engine still bound to notify_push and fighting the next serve for the socket.
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
