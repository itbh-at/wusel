[package]
name = "wusel-fuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published to crates.io: the product ships as an RPM and the crates
# refer to each other by path, which crates.io would reject anyway. Opting
# out here makes an accidental `cargo publish` fail instead of claiming a name.
publish.workspace = true

# wusel-fuse is the FUSE frontend as a LIBRARY (no binary of its own anymore).
# The daemon `wusel` pulls it in. FUSE needs the Linux kernel driver (libfuse3),
# so this frontend is Linux-only; the `fuser` dependency is pulled in only there.

[lib]
name = "wusel_fuse"
path = "src/lib.rs"

[dependencies]
wusel-core = { path = "../wusel-core" }
# The decision core: the adapter speaks its vocabulary and nothing else.
wusel-fsm = { path = "../wusel-fsm" }
anyhow.workspace = true
tracing.workspace = true

# fuser 0.18: the old per-ABI cargo feature flags are gone — the crate negotiates
# the kernel ABI at runtime instead. The kernel-notification API
# (`Session::notifier`, `Notifier::inval_entry`), which we use to push
# server-side add/removes into the kernel's cache, is always available now, with
# no feature flag needed.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"
libc = "0.2"
# The owner thread (src/owner.rs) hands the Provider off to a single thread and
# talks to it over channels: `sync` (mpsc/oneshot) is the only tokio feature this
# crate needs — the runtime itself lives in wusel-core.
tokio = { workspace = true }

# The mount end-to-end test drives a real FUSE mount against the in-process
# wusel-mock server. It runs only on Linux with /dev/fuse (the podman container).
[dev-dependencies]
wusel-mock = { path = "../wusel-mock" }
reqwest = { workspace = true }
tokio = { workspace = true }

# `interrupt_probe` builds its own minimal filesystem to measure kernel
# behaviour, so it needs `fuser` and `libc` directly — an integration test sees
# only the crate's public API plus its dev-dependencies, not its dependencies.
#
# It must be the *same* version as the dependency above. Two versions here are
# not a conflict cargo resolves: both get built, and linking wusel-fuse then
# fails with "multiple candidates for rlib dependency fuser" (E0464). The
# no-feature spelling is deliberate — 0.18 negotiates the kernel ABI at runtime.
[target.'cfg(target_os = "linux")'.dev-dependencies]
fuser = "0.18"
libc = "0.2"
