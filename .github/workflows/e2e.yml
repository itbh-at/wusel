# Nightly end-to-end test against a real Nextcloud (FUSE mount + 3-way merge).
# Runs only when the CODE has changed since the last successful run — tracked by
# a durable git ref refs/e2e-tested/<code-hash> (not the evictable Actions cache).
# workflow_dispatch always runs (and can be pointed at any branch for iteration).
name: E2E

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

# Read-only by default. Only `mark` pushes the marker ref and raises this for
# itself; `gate` and `e2e` compile and execute third-party code and must not
# hold a token that can write to the repository.
permissions:
  contents: read

env:
  # Paths whose content decides whether an E2E run is warranted (docs excluded).
  # This workflow file is in the list on purpose: without it, fixing a bug in the
  # gate or in the E2E job itself would not re-arm the gate, and the fix would go
  # untested until some unrelated code change happened to come along.
  CODE_PATHS: "crates Cargo.toml Cargo.lock packaging integration mise.toml scripts .github/workflows/e2e.yml"
  # See ci.yml for both of these.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_AUTO_INSTALL: "false"

defaults:
  run:
    # `bash --noprofile --norc -eo pipefail`: the implicit default has no
    # pipefail, so a failure inside a pipeline (the marker cleanup below is one)
    # would pass unnoticed.
    shell: bash

jobs:
  discover:
    name: discover the maintained Nextcloud majors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.majors.outputs.matrix }}
      versions: ${{ steps.majors.outputs.versions }}
      digests: ${{ steps.majors.outputs.digests }}
    steps:
      - id: majors
        name: Ask Docker Hub which majors are current
        run: |
          set -euo pipefail
          # The three highest `<major>-apache` tags. Nextcloud maintains roughly
          # three majors at a time, so "the three highest" and "the maintained
          # ones" coincide; when a new major lands and the oldest is dropped, the
          # set follows on its own. The strict pattern also keeps rc/beta tags out.
          curl -fsSL "https://hub.docker.com/v2/repositories/library/nextcloud/tags?page_size=100&name=-apache" \
            > /tmp/tags.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          tags = json.load(open("/tmp/tags.json"))["results"]
          found = {}
          for t in tags:
              m = re.fullmatch(r"(\d+)-apache", t["name"])
              if m:
                  found[int(m.group(1))] = t.get("digest") or ""
          majors = sorted(found, reverse=True)[:3]
          if not majors:
              raise SystemExit("no <major>-apache tags found — Docker Hub response changed?")
          # The newest major is the one we promise to work with; the older two are
          # reported but never turn the workflow red.
          include = [{"nc": str(m), "required": i == 0} for i, m in enumerate(majors)]
          print("matrix=" + json.dumps({"include": include}))
          print("versions=" + " ".join(str(m) for m in majors))
          # Only the digests decide whether anything changed: a major tag moves
          # when Nextcloud ships a patch, and that is exactly a reason to re-test.
          print("digests=" + ",".join(f"{m}:{found[m]}" for m in majors))
          EOF
      - name: Say what will be tested
        env:
          VERSIONS: ${{ steps.majors.outputs.versions }}
          DIGESTS: ${{ steps.majors.outputs.digests }}
        run: |
          {
            echo "### Nextcloud majors under test"
            echo
            echo "- versions: \`$VERSIONS\` (the first is binding, the rest are informational)"
            echo "- image digests: \`$DIGESTS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: gate (run only if code or Nextcloud changed)
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      # Pinned to a commit SHA — see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never writes; the `git ls-remote` below reaches the public
          # repository unauthenticated.
          persist-credentials: false
      - id: hash
        env:
          DIGESTS: ${{ needs.discover.outputs.digests }}
        run: |
          # $CODE_PATHS is deliberately unquoted — it is a list of pathspecs and
          # must word-split into separate arguments.
          code=$(git ls-tree -r HEAD -- $CODE_PATHS | sha256sum | cut -d' ' -f1)
          # The image digests belong in the marker as much as the code does. A
          # server E2E answers "do we still work against Nextcloud", and that
          # question reopens when *either* side moves — testing only on our own
          # changes would let a Nextcloud patch break us in silence.
          h=$(printf '%s\n%s\n' "$code" "$DIGESTS" | sha256sum | cut -d' ' -f1)
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "code hash:     $code"
          echo "combined hash: $h"
      - id: decide
        env:
          HASH: ${{ steps.hash.outputs.hash }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true;  reason="manual dispatch"
          elif git ls-remote --exit-code origin "refs/e2e-tested/$HASH" >/dev/null 2>&1; then
            run=false; reason="this code state was already tested against these Nextcloud images (marker refs/e2e-tested/$HASH exists)"
          else
            run=true;  reason="the code or a Nextcloud image changed since the last successful E2E"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "gate -> run=$run ($reason)"
          # A skipped E2E and a passing E2E both leave the workflow green, so a
          # misbehaving gate could stop testing entirely without anyone noticing.
          # Say out loud, on the run summary, which of the two happened and why.
          if [ "$run" = true ]; then verdict="RUNNING"; else verdict="SKIPPED"; fi
          {
            echo "### E2E gate: $verdict"
            echo
            echo "- reason: $reason"
            echo "- combined hash (code + image digests): \`$HASH\`"
            echo "- watched paths: \`$CODE_PATHS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: FUSE + Nextcloud ${{ matrix.nc }}${{ matrix.required && ' (binding)' || ' (informational)' }}
    needs: [discover, gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One major breaking must not rob us of the answer for the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    # Only the newest major is a promise. The older ones are reported so we know
    # where we stand, but a red build has to mean "we are broken", not "somebody
    # still runs an old server" -- nobody looks at an alarm that cries wolf.
    # A swallowed failure also leaves `needs.e2e.result` at success, so the
    # marker below is still recorded; a failure of the binding major is not
    # swallowed and does block it.
    continue-on-error: ${{ !matrix.required }}
    # The script's own waits (Nextcloud install, mount, upload polls) add up to
    # a few minutes; 45 leaves room for a slow runner without letting a hung
    # FUSE request burn the 360-minute default.
    timeout-minutes: 45
    services:
      nextcloud:
        # A major tag, never `latest`: it tracks Nextcloud's patch releases —
        # which is what a server E2E should test against — but never upgrades a
        # major unannounced. Which majors these are is discovered above rather
        # than written down here, so a new Nextcloud release enters the matrix
        # without anybody editing this file.
        image: nextcloud:${{ matrix.nc }}-apache
        env:
          SQLITE_DATABASE: nextcloud
          NEXTCLOUD_ADMIN_USER: admin
          # Throw-away credential for a container that exists only for the
          # duration of this job. It is not a secret and must never become one.
          NEXTCLOUD_ADMIN_PASSWORD: adminpass
          NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
        ports:
          - 8080:80
    env:
      NC_URL: http://localhost:8080
      NC_USER: admin
      NC_PASS: adminpass # ditto — the ephemeral container admin above
      WUSEL: target/debug/wusel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Compiles and then executes the whole dependency graph's build
          # scripts; the token has no business being left in .git/config.
          persist-credentials: false
      - name: Install FUSE + headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev pkg-config
      - name: Cache the cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.6.10 # pin mise; see ci.yml
          install: false
      - name: Install the pinned Rust toolchain
        run: mise install rust
      # One spelling of the FUSE build, shared with ci.yml and the podman
      # scripts (mise.toml is the single source of truth for it).
      - name: Build wusel (with FUSE)
        run: mise run build-fuse
      - name: Run the E2E test
        run: bash scripts/e2e-nextcloud.sh
      - name: Record the outcome for this major
        if: always()
        env:
          NC: ${{ matrix.nc }}
          REQUIRED: ${{ matrix.required }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then mark="pass"; else mark="FAIL"; fi
          if [ "$REQUIRED" = true ]; then role="binding"; else role="informational"; fi
          echo "### Nextcloud $NC: $mark ($role)" >> "$GITHUB_STEP_SUMMARY"

  mark:
    name: record tested code state
    needs: [gate, e2e]
    if: needs.gate.outputs.run == 'true' && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that needs to write, and the only one that compiles nothing.
    permissions:
      contents: write # push/delete the refs/e2e-tested/* marker
    steps:
      # Keeps the checkout credentials on purpose — this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark this code hash as tested
        env:
          HASH: ${{ needs.gate.outputs.hash }}
        run: |
          set -euo pipefail
          # Keep exactly one marker: drop the others, then record this one.
          # The list is read into an array first, so the deletions do not run in
          # a pipeline subshell — a failing delete then fails the job instead of
          # silently letting stale markers pile up (they used to be swallowed by
          # `|| true`, which also masked a broken cleanup indefinitely).
          # Listed in its own command substitution, not inside the mapfile
          # process substitution: there a failing ls-remote would be invisible.
          listing="$(git ls-remote origin 'refs/e2e-tested/*')"
          mapfile -t refs < <(printf '%s' "$listing" | awk '{print $2}')
          for ref in "${refs[@]}"; do
            if [ "$ref" != "refs/e2e-tested/$HASH" ]; then
              echo "dropping stale marker $ref"
              git push origin ":$ref"
            fi
          done
          git push origin "HEAD:refs/e2e-tested/$HASH"
          echo "recorded refs/e2e-tested/$HASH"
