# Build the Antora documentation and publish it to GitHub Pages.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
# The site is then served at https://itbh-at.github.io/wusel/.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only `deploy` raises pages/id-token for itself. This
# matters here in particular: the workflow also runs on pull_request, and a PR
# from a branch in this repository — which is how this project works, per the
# feature-branch rule — does receive the declared write permissions. The build
# job runs npm-installed third-party code (antora and its dependency tree), so
# it must not be able to publish to Pages or mint an OIDC token.
permissions:
  contents: read

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # See ci.yml for both of these.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_AUTO_INSTALL: "false"

defaults:
  run:
    shell: bash # -e plus pipefail; see ci.yml

jobs:
  build:
    name: build (Antora)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA — see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; documentation/build.sh only reads the tree.
          persist-credentials: false
          # The site build sources every version: the `main` branch and each
          # release tag. That needs the full history and the tags, which a
          # default shallow checkout does not fetch.
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
      # The docs are the one place that legitimately needs the node toolchain —
      # but only `antora`. watchexec and browser-sync serve `build.sh watch`
      # locally, d2 renders diagrams whose SVGs are committed, and rust/hawkeye
      # belong to the Rust workflow. Naming them keeps this job's footprint to
      # what the antora build actually uses.
      - name: Install the pinned docs toolchain (node, antora)
        run: mise install node "npm:antora"
      - name: Build the documentation
        # `site`, not the default: the multi-version, version-selector build.
        run: mise exec -- ./documentation/build.sh site
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: documentation/build/site

  deploy:
    name: deploy to Pages
    # Only publish from main; PRs just build (validation) above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that publishes — and it runs nothing of its own beyond the
    # deploy action, so this is the one place the write scopes belong.
    permissions:
      contents: read # job-level permissions replace, not merge — restate the base
      pages: write # publish the artifact to Pages
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
