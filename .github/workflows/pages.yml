# SPDX-License-Identifier: Apache-2.0
# Build the Antora documentation and publish it to GitHub Pages.
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
# The site is then served at https://itbh-at.github.io/wusel/.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (Antora)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Build the documentation
        run: mise exec -- ./documentation/build.sh
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build/site

  deploy:
    name: deploy to Pages
    # Only publish from main; PRs just build (validation) above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
