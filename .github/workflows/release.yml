# Build the Fedora RPM for x86_64 and aarch64 and attach both to a GitHub
# Release. Triggered by a version tag:
#   git tag v0.1.0 && git push github v0.1.0
# The RPM version comes from the workspace manifest, the release page's name from
# the tag. Those are two independent sources, so the rpm job asserts they agree
# (EXPECT_VERSION -> build-rpm.sh) before anything is built or published;
# otherwise tagging v0.2.0 without bumping Cargo.toml would publish a page titled
# v0.2.0 carrying wusel-0.1.0-*.rpm, and succeed while doing it.
# These are the unsigned community RPMs; signed store builds are separate.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only `release` creates the release and uploads the
# assets. The rpm job runs as root in a container, dnf-installs, compiles the
# entire dependency graph, builds a C extension and then executes the freshly
# built binary — it must not be holding a push-capable token while doing so.
# (actions/upload-artifact uses the runtime token, not GITHUB_TOKEN.)
permissions:
  contents: read

env:
  # See ci.yml for both of these; build-rpm.sh calls `mise exec` itself, outside
  # mise-action's control, which is why the trust path is declared explicitly.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_AUTO_INSTALL: "false"

defaults:
  run:
    shell: bash # -e plus pipefail; see ci.yml

jobs:
  rpm:
    name: build RPM (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    permissions:
      contents: read
    # A full release build of the workspace plus the C extension and rpmbuild,
    # on the slower arm runner and with a cold cache.
    timeout-minutes: 60
    env:
      # The tag/manifest guard: build-rpm.sh refuses to build anything if the
      # packaged version does not match the tag that triggered this run.
      EXPECT_VERSION: ${{ github.ref_name }}
    steps:
      # Native Fedora build deps (git for checkout; the rest for build-rpm.sh).
      - name: Install build dependencies
        run: >
          dnf -y install
          git gcc make pkgconf-pkg-config
          nautilus-devel glib2-devel fuse3-devel
          rpm-build curl ca-certificates
      # Pinned to a commit SHA — see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and everything here compiles third-party code.
          persist-credentials: false
      - name: Cache the cargo registry and build artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-rpm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-rpm-
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
      - name: Install the pinned Rust toolchain
        run: mise install rust
      # Earliest point at which the manifest version can be read the robust way
      # (cargo has to exist first). Runs before the ~30-minute build so a
      # mismatch is reported in seconds, not after a full compile.
      - name: Check the tag matches the packaged version
        run: ./packaging/rpm/build-rpm.sh --check-version
      - name: Build the RPM
        run: ./packaging/rpm/build-rpm.sh
      - name: Upload the RPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: publish release
    needs: rpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes, and it compiles nothing: it just moves the
    # artifacts the rpm job produced onto the release page.
    permissions:
      contents: write # create the release and upload the RPM assets
    steps:
      - name: Download the built RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: rpm-*
          merge-multiple: true
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.rpm
          fail_on_unmatched_files: true
          generate_release_notes: true
