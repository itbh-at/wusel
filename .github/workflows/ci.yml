# SPDX-License-Identifier: Apache-2.0
# GitHub Actions CI. Inert on GitLab (which ignores .github/); runs on GitHub
# from the first push. Uses mise so the toolchain matches local development 1:1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: check · clippy · test (Linux, incl. FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Headers so the wusel-fuse frontend compiles (libfuse3). The real mount
      # e2e (cargo test -p wusel-fuse) is not run here — it needs a privileged
      # /dev/fuse and lives in the podman container (mise run fuse-test); CI only
      # proves the FUSE frontend builds on Linux.
      - name: Install FUSE build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse3-dev pkg-config

      - uses: jdx/mise-action@v2

      - name: Formatting
        run: mise run fmt-check
      - name: Licence headers
        run: mise run headers-check
      - name: Clippy (-D warnings)
        run: mise run clippy
      - name: Check (engine + CLI)
        run: mise run check
      - name: Tests (engine + CLI, native)
        run: mise run test
      - name: Build the FUSE frontend (Linux)
        run: mise exec -- cargo build -p wusel --features fuse
